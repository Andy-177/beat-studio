<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beat Studio</title>
  <style>
    :root {
      --accent: #00f0ff;
      --accent2: #ff00a0;
      --track-bg: #111118;
      --grid: #1a1a2e;
      --border: #2a2a3e;
    }
    * { box-sizing: border-box; user-select: none; margin: 0; padding: 0; }
    body {
      width: 100vw; height: 100vh;
      display: flex; flex-direction: column;
      background: #0a0a0f; color: #e0e0ff;
      font-family: 'Segoe UI', system-ui, sans-serif;
      overflow: hidden;
    }
    .header {
      height: 56px; background: #07070c;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center;
      padding: 0 16px; gap: 12px;
      flex-shrink: 0; z-index: 10;
    }
    .btn {
      background: var(--grid); border: 1px solid var(--border);
      color: #fff; padding: 6px 14px; border-radius: 6px;
      cursor: pointer; font-size: 13px; transition: all .2s;
    }
    .btn:hover { border-color: var(--accent); box-shadow: 0 0 8px rgba(0,240,255,0.2); }
    .btn.primary { background: var(--accent); color: #000; border: none; font-weight: 600; }
    .btn.primary:hover { background: #80f7ff; }
    .btn.danger { background: var(--accent2); border: none; }
    .main { flex: 1; display: flex; overflow: hidden; min-height: 0; }
    .sidebar {
      width: 300px; background: #0d0d14;
      border-right: 1px solid var(--border);
      display: flex; flex-direction: column;
    }
    .sidebar h3 {
      margin: 0; padding: 12px 16px;
      font-size: 14px; color: var(--accent);
      border-bottom: 1px solid var(--border);
    }
    .formula-list { flex: 1; overflow-y: auto; padding: 8px; }
    .formula-item {
      background: var(--track-bg); border: 1px solid var(--accent);
      border-radius: 8px; padding: 10px; margin-bottom: 8px;
      cursor: grab; position: relative;
      transition: border-color .2s, background .2s;
    }
    .formula-item:active { cursor: grabbing; }
    .formula-item.editable {
      cursor: pointer;
      border-color: var(--accent2);
      background: rgba(255,0,160,0.05);
    }
    .formula-item.editable:hover {
      border-color: var(--accent2);
      box-shadow: 0 0 8px rgba(255,0,160,0.2);
    }
    .formula-item .name { font-size: 11px; color: #888; margin-bottom: 4px; }
    .formula-item .latex {
      font-family: 'Courier New', monospace; font-size: 12px;
      color: #a0a0ff; margin-bottom: 6px; word-break: break-all;
    }
    .formula-item canvas { width: 100%; height: 40px; border-radius: 4px; background: #000; }
    .editor { padding: 12px; border-top: 1px solid var(--border); background: #08080c; }
    .editor textarea {
      width: 100%; height: 60px; background: #000;
      border: 1px solid var(--border); color: #0f0;
      font-family: monospace; font-size: 12px;
      padding: 8px; border-radius: 4px; resize: none;
    }
    .editor .hint { font-size: 11px; color: #666; margin-top: 4px; line-height: 1.4; }
    .timeline-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; }
    .timeline-header {
      height: 40px; background: #07070c;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; position: relative;
    }
    .time-ruler { flex: 1; height: 100%; position: relative; margin-left: 80px; }
    .time-mark {
      position: absolute; top: 0; height: 100%;
      border-left: 1px solid #333;
      font-size: 10px; color: #555;
      padding-left: 4px; padding-top: 4px;
    }
    .tracks-container {
      flex: 1; overflow-y: auto; overflow-x: hidden;
      position: relative;
    }
    .track {
      height: 100px; border-bottom: 1px solid var(--border);
      background: var(--track-bg); position: relative; display: flex;
    }
    .track-info {
      width: 80px; background: #0a0a10;
      border-right: 1px solid var(--border);
      display: flex; flex-direction: column;
      justify-content: center; padding: 8px;
      position: relative; z-index: 2;
    }
    .track-name { font-size: 12px; font-weight: 600; color: var(--accent); margin-bottom: 4px; }
    .track-vol { font-size: 11px; color: #666; }
    .track-waves {
      flex: 1; position: relative;
      overflow-x: auto; overflow-y: hidden;
      background-image: linear-gradient(90deg, transparent 99%, #1a1a2e 99%);
      background-size: 50px 100%;
    }
    .wave-block {
      position: absolute; top: 8px; height: 84px;
      background: linear-gradient(180deg, rgba(0,240,255,0.15), rgba(0,240,255,0.05));
      border: 1px solid var(--accent); border-radius: 6px;
      cursor: move; overflow: hidden; min-width: 40px;
      transition: border-color .15s, background .15s;
    }
    .wave-block.selected {
      border-color: var(--accent2);
      box-shadow: 0 0 0 2px rgba(255,0,160,0.3);
    }
    .wave-block.collision {
      border-color: #ff3333 !important;
      background: linear-gradient(180deg, rgba(255,0,0,0.2), rgba(255,0,0,0.05)) !important;
    }
    .wave-block .delete-btn {
      position: absolute; top: 2px; left: 2px;
      width: 16px; height: 16px;
      background: rgba(255,0,0,0.8); color: #fff;
      font-size: 11px; line-height: 16px;
      text-align: center; border-radius: 3px;
      cursor: pointer; z-index: 5; opacity: 0;
      transition: opacity .2s;
    }
    .wave-block:hover .delete-btn { opacity: 1; }
    .wave-block .delete-btn:hover { background: #ff3333; }
    .wave-block .resize-handle {
      position: absolute; right: 0; top: 0;
      width: 10px; height: 100%; cursor: e-resize;
      background: rgba(255,255,255,0.08);
    }
    .wave-block .resize-handle:hover { background: rgba(255,255,255,0.25); }
    .wave-block canvas { width: 100%; height: 100%; }
    .wave-block .info {
      position: absolute; bottom: 2px; left: 4px;
      font-size: 9px; color: var(--accent);
      background: rgba(0,0,0,0.7);
      padding: 1px 4px; border-radius: 2px;
      pointer-events: none;
    }
    .playhead {
      position: absolute; top: 0; bottom: 0;
      width: 2px; background: var(--accent2);
      z-index: 100;
      box-shadow: 0 0 10px var(--accent2);
      cursor: ew-resize;
    }
    .playhead::before {
      content: '';
      position: absolute;
      top: -2px;
      left: 50%;
      transform: translateX(-50%);
      width: 14px;
      height: 14px;
      background: var(--accent2);
      clip-path: polygon(50% 100%, 0% 0%, 100% 0%);
      filter: drop-shadow(0 0 4px var(--accent2));
      cursor: ew-resize;
    }
    .playhead::after {
      content: '';
      position: absolute;
      top: 0; left: 50%;
      transform: translateX(-50%);
      width: 14px; height: 100%;
      background: transparent;
      cursor: ew-resize;
    }
    .bottom-panel {
      height: 150px;
      background: #07070c;
      border-top: 1px solid var(--border);
      padding: 10px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-shrink: 0;
      z-index: 20;
    }
    .bottom-panel.empty {
      align-items: center;
      justify-content: center;
    }
    .bottom-panel .placeholder {
      color: #555;
      font-size: 13px;
    }
    .bottom-row {
      display: flex;
      gap: 20px;
      align-items: center;
    }
    .bottom-row .field {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .bottom-row label {
      font-size: 12px;
      color: #888;
      min-width: 36px;
    }
    .bottom-row input[type="text"] {
      background: #000;
      border: 1px solid var(--border);
      color: #fff;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
      width: 140px;
    }
    .bottom-row input[type="range"] {
      width: 120px;
      accent-color: var(--accent);
    }
    .bottom-row .value-display {
      font-size: 12px;
      color: var(--accent);
      min-width: 44px;
      font-family: monospace;
    }
    .bottom-panel textarea {
      width: 100%;
      background: #000;
      border: 1px solid var(--border);
      color: #0f0;
      font-family: monospace;
      font-size: 12px;
      padding: 6px 8px;
      border-radius: 4px;
      resize: none;
      height: 54px;
    }
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.8); z-index: 200;
      display: none; align-items: center; justify-content: center;
    }
    .modal-overlay.active { display: flex; }
    .modal {
      background: #111118; border: 1px solid var(--border);
      border-radius: 12px; padding: 20px; width: 420px;
    }
    .modal h4 { margin: 0 0 12px; color: var(--accent); }
    .modal input, .modal select {
      width: 100%; background: #000; border: 1px solid var(--border);
      color: #fff; padding: 8px; border-radius: 4px;
      margin-bottom: 12px; font-family: monospace;
    }
    .modal textarea {
      width: 100%; height: 80px; background: #000;
      border: 1px solid var(--border); color: #0f0;
      padding: 8px; border-radius: 4px;
      font-family: monospace; resize: none;
    }
    .modal .actions { display: flex; gap: 8px; justify-content: flex-end; }
  </style>

<body>
  <div class="header">
    <button class="btn primary" id="playBtn">▶ 播放</button>
    <button class="btn" id="stopBtn">⏹ 停止</button>
    <button class="btn" id="addTrackBtn">➕ 添加音轨</button>
    <div style="width:1px;height:24px;background:var(--border);margin:0 8px;"></div>
    <input type="text" id="projectName" value="未命名项目" style="background:#000;border:1px solid var(--border);color:#fff;padding:4px 10px;border-radius:4px;font-size:13px;width:140px;outline:none;" onfocus="this.style.borderColor='var(--accent)'" onblur="this.style.borderColor='var(--border)'">
    <button class="btn" id="importBtn">📂 导入</button>
    <button class="btn" id="exportBtn">💾 导出</button>
    <button class="btn primary" id="saveAudioBtn">🎵 保存音频</button>
    <input type="file" id="importFile" accept=".json" style="display:none;">
    <div style="flex:1"></div>
    <div style="font-size:12px;color:#666;">Beat Studio | 样本精确计时 | 点击片段编辑属性</div>
  </div>

  <div class="main">
    <div class="sidebar">
      <h3 style="display:flex;align-items:center;justify-content:space-between;padding:12px 16px;font-size:14px;color:var(--accent);border-bottom:1px solid var(--border);margin:0;">
        <span>🧪 LaTeX 公式库</span>
        <button class="btn primary" id="addFormulaModalBtn" style="font-size:11px;padding:4px 10px;margin-right:8px;">➕ 添加公式</button>
      </h3>
      <div class="formula-list" id="formulaList"></div>
      <div class="editor" style="padding:12px;border-top:1px solid var(--border);background:#08080c;">
        <div class="hint" style="font-size:11px;color:#666;line-height:1.4;">
          变量 t = 时间(秒)，支持 \sin \cos \frac \sqrt \lfloor \pi 等<br>
          双击或右键公式项即可编辑
        </div>
      </div>
    </div>

    <div class="timeline-area">
      <div class="timeline-header">
        <div style="width:80px;text-align:center;font-size:11px;color:#555;">时间→</div>
        <div class="time-ruler" id="timeRuler"></div>
      </div>
      <div class="tracks-container" id="tracksContainer">
        <div class="playhead" id="playhead" style="left:80px;" title="拖拽移动时间指针"></div>
      </div>
    </div>
  </div>

  <div class="bottom-panel empty" id="bottomPanel">
    <div class="placeholder" id="bpEmpty">点击音频片段以编辑属性</div>
    <div id="bpContent" style="display:none;width:100%;">
      <div class="bottom-row">
        <div class="field">
          <label>名称</label>
          <input type="text" id="bpName">
        </div>
        <div class="field">
          <label>音量</label>
          <input type="range" id="bpVolume" min="0" max="100" value="100">
          <span class="value-display" id="bpVolumeVal">100%</span>
        </div>
        <div class="field">
          <label>倍率</label>
          <input type="range" id="bpRate" min="0.1" max="3" step="0.1" value="1">
          <span class="value-display" id="bpRateVal">1.0x</span>
        </div>
      </div>
      <div class="bottom-row" style="flex-direction:column;align-items:flex-start;gap:4px;">
        <label style="min-width:auto;">公式</label>
        <textarea id="bpFormula"></textarea>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="editModal">
    <div class="modal">
      <h4 id="modalTitle">编辑 LaTeX 公式</h4>
      <input type="text" id="editName" placeholder="名称">
      <textarea id="editFormula" placeholder="\sin(2\pi \cdot 440 \cdot t)"></textarea>
      <div class="actions">
        <button class="btn" id="cancelEdit">取消</button>
        <button class="btn primary" id="saveEdit">保存</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="saveAudioModal">
    <div class="modal">
      <h4>保存音频文件 (WAV 无损)</h4>
      <div style="margin-bottom:12px;">
        <label style="font-size:12px;color:#888;display:block;margin-bottom:6px;">采样率</label>
        <select id="saveSampleRate" style="width:100%;background:#000;border:1px solid var(--border);color:#fff;padding:8px;border-radius:4px;font-family:monospace;">
          <option value="44100">44100 Hz (CD 音质)</option>
          <option value="48000">48000 Hz (专业)</option>
          <option value="96000">96000 Hz (高解析)</option>
        </select>
      </div>
      <div style="margin-bottom:12px;">
        <label style="font-size:12px;color:#888;display:block;margin-bottom:6px;">时长</label>
        <div id="autoDuration" style="color:var(--accent);font-family:monospace;font-size:14px;">自动计算中...</div>
        <div style="font-size:11px;color:#666;margin-top:4px;">根据最后一个音频片段的结束时间自动确定</div>
      </div>
      <div class="actions">
        <button class="btn" id="cancelSaveAudio">取消</button>
        <button class="btn primary" id="confirmSaveAudio">保存 WAV</button>
      </div>
    </div>
  </div>

  <script>
    (function(){
      const PIXELS_PER_SECOND = 50;
      let audioCtx = null;
      let isPlaying = false;
      let pauseTime = 0;
      let globalSampleIndex = 0;
      let animationId = null;
      let trackCount = 0;
      let formulaIdCounter = 0;
      let blockIdCounter = 0;
      let formulas = [];
      let tracks = [];
      let blocks = [];
      let currentDrag = null;
      let currentResize = null;
      let editingBlock = null;
      let editingFormula = null;
      let selectedBlock = null;
      let masterNode = null;
      let masterGain = null;
      

      const defaultFormulas = [
        {name:"正弦波 440Hz", code:"\\sin(2 \\cdot \\pi \\cdot 440 \\cdot t)"},
        {name:"低音 220Hz", code:"\\sin(2 \\cdot \\pi \\cdot 220 \\cdot t)"},
        {name:"高音 880Hz", code:"\\sin(2 \\cdot \\pi \\cdot 880 \\cdot t)"},
        {name:"颤音", code:"\\sin(2 \\cdot \\pi \\cdot 440 \\cdot t) \\cdot \\sin(2 \\cdot \\pi \\cdot 4 \\cdot t)"},
        {name:"大三度和弦", code:"\\frac{\\sin(2 \\cdot \\pi \\cdot 440 \\cdot t) + \\sin(2 \\cdot \\pi \\cdot 554 \\cdot t)}{2}"},
        {name:"锯齿波", code:"2 \\cdot (t \\cdot 440 - \\lfloor t \\cdot 440 + 0.5 \\rfloor)"},
        {name:"三角波", code:"\\frac{2}{\\pi} \\cdot \\arcsin(\\sin(2 \\cdot \\pi \\cdot 440 \\cdot t))"},
        {name:"指数衰减", code:"\\sin(2 \\cdot \\pi \\cdot 440 \\cdot t) \\cdot e^{-2t}"},
        {name:"调频 FM", code:"\\sin(2 \\cdot \\pi \\cdot 440 \\cdot t + 5 \\cdot \\sin(2 \\cdot \\pi \\cdot 7 \\cdot t))"},
        {name:"噪声", code:"\\sin(2 \\cdot \\pi \\cdot t) \\cdot \\cos(2 \\cdot \\pi \\cdot \\sqrt{2} \\cdot t)"}
      ];

      // ===== LaTeX → JS 编译器 =====
      function findMatchingBrace(str, start) {
        let depth = 1;
        for (let i = start; i < str.length; i++) {
          if (str[i] === '{') depth++;
          else if (str[i] === '}') {
            depth--;
            if (depth === 0) return i;
          }
        }
        return -1;
      }

      function processLatexCommands(expr) {
        let result = expr;
        let idx = result.indexOf('\\frac');
        while (idx !== -1) {
          const open1 = result.indexOf('{', idx + 5);
          if (open1 === -1) break;
          const close1 = findMatchingBrace(result, open1 + 1);
          if (close1 === -1) break;
          const open2 = result.indexOf('{', close1 + 1);
          if (open2 === -1) break;
          const close2 = findMatchingBrace(result, open2 + 1);
          if (close2 === -1) break;
          const num = result.slice(open1 + 1, close1);
          const den = result.slice(open2 + 1, close2);
          result = result.slice(0, idx) + `((${num})/(${den}))` + result.slice(close2 + 1);
          idx = result.indexOf('\\frac');
        }
        idx = result.indexOf('\\sqrt');
        while (idx !== -1) {
          const open = result.indexOf('{', idx + 5);
          if (open === -1) break;
          const close = findMatchingBrace(result, open + 1);
          if (close === -1) break;
          const content = result.slice(open + 1, close);
          result = result.slice(0, idx) + `Math.sqrt(${content})` + result.slice(close + 1);
          idx = result.indexOf('\\sqrt');
        }
        idx = result.indexOf('\\abs');
        while (idx !== -1) {
          const open = result.indexOf('{', idx + 4);
          if (open === -1) break;
          const close = findMatchingBrace(result, open + 1);
          if (close === -1) break;
          const content = result.slice(open + 1, close);
          result = result.slice(0, idx) + `Math.abs(${content})` + result.slice(close + 1);
          idx = result.indexOf('\\abs');
        }
        return result;
      }

      function latexToJS(expr) {
        let js = expr.replace(/\$/g, '');
        js = processLatexCommands(js);
        js = js.replace(/\\sin/g, 'Math.sin')
               .replace(/\\cos/g, 'Math.cos')
               .replace(/\\tan/g, 'Math.tan')
               .replace(/\\log/g, 'Math.log10')
               .replace(/\\ln/g, 'Math.log')
               .replace(/\\exp/g, 'Math.exp')
               .replace(/\\arcsin/g, 'Math.asin')
               .replace(/\\arccos/g, 'Math.acos')
               .replace(/\\arctan/g, 'Math.atan')
               .replace(/\\pi/g, 'Math.PI')
               .replace(/\\cdot/g, '*')
               .replace(/\\times/g, '*')
               .replace(/\\div/g, '/')
               .replace(/\\left\(/g, '(')
               .replace(/\\right\)/g, ')')
               .replace(/\\left\[/g, '[')
               .replace(/\\right\]/g, ']')
               .replace(/\\lfloor/g, 'Math.floor(')
               .replace(/\\rfloor/g, ')')
               .replace(/\\lceil/g, 'Math.ceil(')
               .replace(/\\rceil/g, ')');
        js = js.replace(/\^\{([^}]*)\}/g, '**($1)');
        js = js.replace(/\^([a-zA-Z0-9.]+)/g, '**$1');
        js = js.replace(/\be\b(?![a-zA-Z0-9_])/g, 'Math.E');
        return js;
      }

      function compileFormula(code) {
        try {
          const js = latexToJS(code);
          const fn = new Function('t', `with(Math) { return (${js}); }`);
          fn(0);
          return fn;
        } catch(e) {
          return () => 0;
        }
      }

      function evalCompiled(fn, t) {
        try {
          let v = fn(t);
          if (!isFinite(v)) return 0;
          return Math.max(-1, Math.min(1, v));
        } catch(e) {
          return 0;
        }
      }

      // ===== 音频 =====
      function initAudio(){
        if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
        if(audioCtx.state==='suspended') audioCtx.resume();
      }

      // ===== 绘图 =====
      function drawWaveform(canvas, compiledFn, color='#00f0ff'){
        const ctx = canvas.getContext('2d');
        const w = canvas.width, h = canvas.height;
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, w, h);
        ctx.strokeStyle = color;
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        const duration = 2;
        for (let x = 0; x < w; x++) {
          const t = (x / w) * duration;
          const val = evalCompiled(compiledFn, t);
          const py = h/2 - val * (h/2 - 2);
          if (x === 0) ctx.moveTo(x, py);
          else ctx.lineTo(x, py);
        }
        ctx.stroke();
      }

      // ===== 碰撞检测 =====
      function hasOverlap(trackId, start, duration, excludeId){
        const end = start + duration;
        return blocks.some(b => {
          if (b.trackId !== trackId) return false;
          if (excludeId !== undefined && b.id === excludeId) return false;
          const bEnd = b.start + b.duration;
          return !(end <= b.start || start >= bEnd);
        });
      }

      function findNonOverlappingStart(trackId, desiredStart, duration, excludeId){
        let s = Math.max(0, desiredStart);
        for (let safety = 0; safety < 200; safety++){
          if (!hasOverlap(trackId, s, duration, excludeId)) return s;
          const conflict = blocks.find(b => {
            if (b.trackId !== trackId) return false;
            if (excludeId !== undefined && b.id === excludeId) return false;
            const bEnd = b.start + b.duration;
            const end = s + duration;
            return !(end <= b.start || s >= bEnd);
          });
          if (!conflict) return s;
          s = conflict.start + conflict.duration;
        }
        return s;
      }

      function getTrackWavesAt(mouseX, mouseY){
        const all = document.querySelectorAll('.track-waves');
        for (const w of all) {
          const r = w.getBoundingClientRect();
          if (mouseX >= r.left && mouseX <= r.right && mouseY >= r.top && mouseY <= r.bottom) return w;
        }
        return null;
      }

      // ===== 底栏 =====
      function showBottomPanel(block){
        const panel = document.getElementById('bottomPanel');
        panel.classList.remove('empty');
        document.getElementById('bpEmpty').style.display = 'none';
        document.getElementById('bpContent').style.display = 'block';
        document.getElementById('bpName').value = block.name || '';
        document.getElementById('bpVolume').value = Math.round((block.volume || 1) * 100);
        document.getElementById('bpVolumeVal').textContent = Math.round((block.volume || 1) * 100) + '%';
        document.getElementById('bpRate').value = block.rate || 1;
        document.getElementById('bpRateVal').textContent = (block.rate || 1).toFixed(1) + 'x';
        document.getElementById('bpFormula').value = block.code || '';
      }

      function hideBottomPanel(){
        const panel = document.getElementById('bottomPanel');
        panel.classList.add('empty');
        document.getElementById('bpEmpty').style.display = 'block';
        document.getElementById('bpContent').style.display = 'none';
      }

      // ===== UI 构建 =====
      function createFormulaItem(f){
        const div=document.createElement('div');
        div.className='formula-item';
        div.draggable=true;
        div.dataset.fid=f.id;
        div.innerHTML=`<div class="name">${f.name}</div><div class="latex">${f.code}</div><canvas width="260" height="40"></canvas>`;
        const cv=div.querySelector('canvas');
        requestAnimationFrame(()=>drawWaveform(cv, f.compiled));
        div.addEventListener('dragstart',e=>{
          e.dataTransfer.setData('formulaId',f.id);
          e.dataTransfer.effectAllowed='copy';
        });
        div.addEventListener('dblclick',()=>openEditModal(f));
        div.addEventListener('contextmenu',e=>{
          e.preventDefault();
          openEditModal(f);
        });
        return div;
      }

      function renderFormulas(){
        const list=document.getElementById('formulaList');
        list.innerHTML='';
        formulas.forEach(f=>list.appendChild(createFormulaItem(f)));
      }

      function openEditModal(f){
        editingFormula = f;
        document.getElementById('modalTitle').textContent = '编辑 LaTeX 公式';
        document.getElementById('editName').value = f.name;
        document.getElementById('editFormula').value = f.code;
        document.getElementById('editModal').classList.add('active');
      }

      

      function addFormula(name,code){
        const compiled = compileFormula(code);
        formulas.push({id: ++formulaIdCounter, name, code, compiled});
        renderFormulas();
      }

      function addTrack(){
        trackCount++;
        const trackId=trackCount;
        const container=document.getElementById('tracksContainer');
        const trackDiv=document.createElement('div');
        trackDiv.className='track';
        trackDiv.dataset.trackId=trackId;
        trackDiv.innerHTML=`<div class="track-info"><div class="track-name">音轨 ${trackId}</div><div class="track-vol">Vol: 100%</div><button class="btn" style="margin-top:4px;font-size:10px;padding:2px 6px;">删除</button></div><div class="track-waves" data-track-id="${trackId}"></div>`;
        container.appendChild(trackDiv);
        tracks.push({id:trackId,div:trackDiv});
        trackDiv.querySelector('button').onclick=function(){
          trackDiv.remove();
          tracks=tracks.filter(t=>t.id!==trackId);
        };
        setupTrackDrop(trackDiv.querySelector('.track-waves'));
      }

      function removeBlock(block){
        block.div.remove();
        blocks=blocks.filter(b=>b.id!==block.id);
        if(selectedBlock===block){
          selectedBlock=null;
          hideBottomPanel();
        }
      }

      function selectBlock(block){
        if(selectedBlock) selectedBlock.div.classList.remove('selected');
        selectedBlock=block;
        if(block){
          block.div.classList.add('selected');
          showBottomPanel(block);
        }else{
          hideBottomPanel();
        }
      }

      function createBlock(f,trackId,startSec,durSec){
        const id=++blockIdCounter;
        const div=document.createElement('div');
        div.className='wave-block';
        div.dataset.blockId=id;
        div.style.left=(startSec*PIXELS_PER_SECOND)+'px';
        div.style.width=(durSec*PIXELS_PER_SECOND)+'px';
        div.innerHTML=`<div class="delete-btn" title="删除">×</div><canvas></canvas><div class="info">${f.name}</div><div class="resize-handle"></div>`;
        const cv=div.querySelector('canvas');
        cv.width=Math.max(40,durSec*PIXELS_PER_SECOND);
        cv.height=84;

        const compiled = f.compiled || compileFormula(f.code);
        drawWaveform(cv, compiled);

        const block={
          id, name: f.name, code: f.code, compiled,
          trackId, start: startSec, duration: durSec,
          div, volume: 1, rate: 1
        };
        blocks.push(block);

        div.addEventListener('mousedown',e=>{
          if(e.target.classList.contains('resize-handle') || e.target.classList.contains('delete-btn')) return;
          selectBlock(block);
          const parent = div.parentElement;
          const rect = parent.getBoundingClientRect();
          const scrollLeft = parent.scrollLeft;
          const startLeft = parseFloat(div.style.left) || 0;
          const offsetXInWaves = e.clientX - rect.left + scrollLeft - startLeft;
          currentDrag={
            block, div,
            offsetXInWaves,
            origTrackId: block.trackId,
            origStart: block.start,
            origLeft: startLeft,
            origParent: parent
          };
          e.preventDefault();
        });

        div.querySelector('.delete-btn').addEventListener('click',e=>{
          e.stopPropagation();
          removeBlock(block);
        });

        const handle=div.querySelector('.resize-handle');
        handle.addEventListener('mousedown',e=>{
          currentResize={block, div, startX: e.clientX, startW: parseFloat(div.style.width) || 40};
          e.stopPropagation();
          e.preventDefault();
        });

        div.addEventListener('dblclick',()=>{
          editingBlock=block;
          document.getElementById('editName').value=block.name;
          document.getElementById('editFormula').value=block.code;
          document.getElementById('editModal').classList.add('active');
        });

        return div;
      }

      function setupTrackDrop(waves){
        waves.addEventListener('dragover',e=>{e.preventDefault();e.dataTransfer.dropEffect='copy';});
        waves.addEventListener('drop',e=>{
          e.preventDefault();
          const fid=parseInt(e.dataTransfer.getData('formulaId'));
          const f=formulas.find(x=>x.id===fid); if(!f) return;
          const rect=waves.getBoundingClientRect();
          const x=e.clientX-rect.left+waves.scrollLeft;
          const desiredStart=Math.max(0,Math.round(x/PIXELS_PER_SECOND*4)/4);
          const trackId=parseInt(waves.dataset.trackId);
          const duration=2;
          const finalStart=findNonOverlappingStart(trackId,desiredStart,duration,undefined);
          const blockDiv=createBlock(f,trackId,finalStart,duration);
          waves.appendChild(blockDiv);
        });
      }

      // ===== 全局交互 =====
      document.addEventListener('mousedown',e=>{
        const isBlock = e.target.closest('.wave-block');
        const isPanel = e.target.closest('.bottom-panel');
        const isModal = e.target.closest('.modal-overlay.active');
        const isSidebar = e.target.closest('.sidebar');
        if(!isBlock && !isPanel && !isModal && !isSidebar){
          selectBlock(null);
        }
      });

      document.addEventListener('mousemove',e=>{
        if(currentDrag){
          const targetWaves = getTrackWavesAt(e.clientX, e.clientY);
          if (!targetWaves) {
            currentDrag.div.classList.add('collision');
            return;
          }
          const targetTrackId = parseInt(targetWaves.dataset.trackId);
          const rect = targetWaves.getBoundingClientRect();
          const scrollLeft = targetWaves.scrollLeft;
          let candidateLeft = e.clientX - rect.left + scrollLeft - currentDrag.offsetXInWaves;
          candidateLeft = Math.max(0, candidateLeft);
          const candidateStart = Math.round(candidateLeft / PIXELS_PER_SECOND * 4) / 4;

          if (!hasOverlap(targetTrackId, candidateStart, currentDrag.block.duration, currentDrag.block.id)) {
            if (currentDrag.div.parentElement !== targetWaves) {
              targetWaves.appendChild(currentDrag.div);
            }
            currentDrag.div.style.left = candidateLeft + 'px';
            currentDrag.block.start = candidateStart;
            currentDrag.block.trackId = targetTrackId;
            currentDrag.div.classList.remove('collision');
          } else {
            currentDrag.div.classList.add('collision');
          }
        }
        if(currentResize){
          const dx=e.clientX-currentResize.startX;
          let candidateW=Math.max(40,currentResize.startW+dx);
          const candidateDuration=Math.round(candidateW/PIXELS_PER_SECOND*4)/4;

          if(!hasOverlap(currentResize.block.trackId,currentResize.block.start,candidateDuration,currentResize.block.id)){
            currentResize.div.style.width=candidateW+'px';
            currentResize.block.duration=candidateDuration;
            const cv=currentResize.div.querySelector('canvas');
            cv.width=candidateW;
            drawWaveform(cv,currentResize.block.compiled);
            currentResize.div.classList.remove('collision');
          }else{
            currentResize.div.classList.add('collision');
          }
        }
      });

      document.addEventListener('mouseup',()=>{
        if(currentDrag){
          currentDrag.div.classList.remove('collision');
          currentDrag=null;
        }
        if(currentResize){
          currentResize.div.classList.remove('collision');
          currentResize=null;
        }
      });

      document.addEventListener('keydown',e=>{
        if((e.key==='Delete' || e.key==='Backspace') && selectedBlock && !editingBlock){
          e.preventDefault();
          removeBlock(selectedBlock);
        }
      });

      // 底栏事件
      document.getElementById('bpName').addEventListener('input', function(){
        if(!selectedBlock) return;
        selectedBlock.name = this.value;
        selectedBlock.div.querySelector('.info').textContent = this.value;
      });
      document.getElementById('bpVolume').addEventListener('input', function(){
        if(!selectedBlock) return;
        selectedBlock.volume = parseInt(this.value) / 100;
        document.getElementById('bpVolumeVal').textContent = this.value + '%';
      });
      document.getElementById('bpRate').addEventListener('input', function(){
        if(!selectedBlock) return;
        selectedBlock.rate = parseFloat(this.value);
        document.getElementById('bpRateVal').textContent = selectedBlock.rate.toFixed(1) + 'x';
      });
      document.getElementById('bpFormula').addEventListener('input', function(){
        if(!selectedBlock) return;
        selectedBlock.code = this.value;
        selectedBlock.compiled = compileFormula(this.value);
        const cv = selectedBlock.div.querySelector('canvas');
        cv.width = Math.max(40, selectedBlock.duration * PIXELS_PER_SECOND);
        drawWaveform(cv, selectedBlock.compiled);
      });

      function renderRuler(){
        const ruler=document.getElementById('timeRuler');
        ruler.innerHTML='';
        for(let i=0;i<60;i++){
          const mark=document.createElement('div');
          mark.className='time-mark';
          mark.style.left=(i*PIXELS_PER_SECOND)+'px';
          mark.textContent=i+'s';
          ruler.appendChild(mark);
        }
      }

      function updatePlayhead(){
        if(!isPlaying) return;
        const elapsed = globalSampleIndex / audioCtx.sampleRate;
        const x = 80 + elapsed * PIXELS_PER_SECOND;
        document.getElementById('playhead').style.left = x + 'px';
        animationId = requestAnimationFrame(updatePlayhead);
      }

      // ===== 时间指针拖拽 =====
      let playheadDragging = false;
      let playheadDragOffsetX = 0;
      const playheadEl = document.getElementById('playhead');
      const TRACK_INFO_WIDTH = 80;
      playheadEl.addEventListener('mousedown', e => {
        playheadDragging = true;
        const rect = playheadEl.getBoundingClientRect();
        playheadDragOffsetX = e.clientX - rect.left;
        e.preventDefault();
        e.stopPropagation();
      });
      document.addEventListener('mousemove', e => {
        if (!playheadDragging) return;
        const container = document.getElementById('tracksContainer');
        const rect = container.getBoundingClientRect();
        const scrollLeft = container.scrollLeft;
        // 计算指针在 track-waves 区域中的位置（减去 track-info 的 80px 偏移）
        let wavesX = e.clientX - rect.left + scrollLeft - playheadDragOffsetX - TRACK_INFO_WIDTH;
        wavesX = Math.max(0, wavesX);
        const time = wavesX / PIXELS_PER_SECOND;
        playheadEl.style.left = (TRACK_INFO_WIDTH + time * PIXELS_PER_SECOND) + 'px';
        pauseTime = time;
        globalSampleIndex = Math.floor(time * (audioCtx ? audioCtx.sampleRate : 44100));
      });
      document.addEventListener('mouseup', () => {
        playheadDragging = false;
      });

      // ===== 播放控制（样本精确单节点混音） =====
      function play(){
        initAudio();
        if(isPlaying) return;
        isPlaying = true;
        globalSampleIndex = Math.floor(pauseTime * audioCtx.sampleRate);

        masterGain = audioCtx.createGain();
        masterGain.gain.value = 0.8;
        masterGain.connect(audioCtx.destination);

        const bufferSize = 4096;
        masterNode = audioCtx.createScriptProcessor(bufferSize, 0, 1);
        const sampleRate = audioCtx.sampleRate;

        masterNode.onaudioprocess = function(e){
          const out = e.outputBuffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) {
            const globalTime = (globalSampleIndex + i) / sampleRate;
            let mix = 0;
            for (const b of blocks) {
              if (globalTime >= b.start && globalTime < b.start + b.duration) {
                const localTime = globalTime - b.start;
                const sample = evalCompiled(b.compiled, localTime * (b.rate || 1));
                mix += sample * (b.volume || 1);
              }
            }
            out[i] = Math.tanh(mix * 0.5) * 0.9;
          }
          globalSampleIndex += bufferSize;
        };

        masterNode.connect(masterGain);
        document.getElementById('playBtn').textContent='⏸ 暂停';
        updatePlayhead();
      }

      function pause(){
        if(!isPlaying) return;
        isPlaying = false;
        pauseTime = globalSampleIndex / audioCtx.sampleRate;
        document.getElementById('playBtn').textContent='▶ 播放';
        if(animationId) cancelAnimationFrame(animationId);
        if(masterNode){ masterNode.disconnect(); masterNode = null; }
        if(masterGain){ masterGain.disconnect(); masterGain = null; }
      }

      function stop(){
        isPlaying = false;
        pauseTime = 0;
        globalSampleIndex = 0;
        document.getElementById('playBtn').textContent='▶ 播放';
        document.getElementById('playhead').style.left='80px';
        if(animationId) cancelAnimationFrame(animationId);
        if(masterNode){ masterNode.disconnect(); masterNode = null; }
        if(masterGain){ masterGain.disconnect(); masterGain = null; }
      }

      document.getElementById('playBtn').addEventListener('click',()=>{
        if(isPlaying) pause(); else play();
      });
      document.getElementById('stopBtn').addEventListener('click',stop);
      document.getElementById('addTrackBtn').addEventListener('click',addTrack);
      document.getElementById('addFormulaModalBtn').addEventListener('click',()=>{
        isAddingFormula = true;
        document.getElementById('modalTitle').textContent = '添加 LaTeX 公式';
        document.getElementById('editName').value = '公式' + (formulaIdCounter + 1);
        document.getElementById('editFormula').value = '\sin(2 \cdot \pi \cdot 440 \cdot t)';
        document.getElementById('editModal').classList.add('active');
      });
      document.getElementById('cancelEdit').addEventListener('click',()=>{
        document.getElementById('editModal').classList.remove('active');
        editingBlock=null;
        editingFormula=null;
        isAddingFormula = false;
      });
      document.getElementById('saveEdit').addEventListener('click',()=>{
        const name = document.getElementById('editName').value.trim();
        const code = document.getElementById('editFormula').value.trim();
        if(!name || !code) {
          document.getElementById('editModal').classList.remove('active');
          editingBlock=null;
          editingFormula=null;
          isAddingFormula = false;
          return;
        }
        if(isAddingFormula){
          addFormula(name, code);
          isAddingFormula = false;
        } else {
          if(editingBlock){
            editingBlock.name = name;
            editingBlock.code = code;
            editingBlock.compiled = compileFormula(code);
            editingBlock.div.querySelector('.info').textContent = name;
            const cv = editingBlock.div.querySelector('canvas');
            drawWaveform(cv, editingBlock.compiled);
            if(selectedBlock === editingBlock) showBottomPanel(editingBlock);
          }
          if(editingFormula){
            editingFormula.name = name;
            editingFormula.code = code;
            editingFormula.compiled = compileFormula(code);
            renderFormulas();
          }
        }
        document.getElementById('editModal').classList.remove('active');
        editingBlock=null;
        editingFormula=null;
      });

      // ===== 导入导出 =====
      function exportProject(){
        const data = {
          projectName: document.getElementById('projectName').value,
          formulas: formulas.map(f => ({name: f.name, code: f.code})),
          tracks: tracks.map(t => ({id: t.id})),
          blocks: blocks.map(b => ({
            name: b.name,
            code: b.code,
            trackId: b.trackId,
            start: b.start,
            duration: b.duration,
            volume: b.volume || 1,
            rate: b.rate || 1
          }))
        };
        const blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = (data.projectName || 'project') + '.json';
        a.click();
        URL.revokeObjectURL(url);
      }

      function importProject(data){
        // 清除现有
        blocks.forEach(b => b.div.remove());
        blocks = [];
        tracks.forEach(t => t.div.remove());
        tracks = [];
        formulas = [];
        formulaIdCounter = 0;
        blockIdCounter = 0;
        trackCount = 0;

        document.getElementById('projectName').value = data.projectName || '未命名项目';

        // 恢复公式
        (data.formulas || []).forEach(f => addFormula(f.name, f.code));

        // 恢复音轨
        const trackCountNeeded = Math.max(1, (data.tracks || []).length);
        for(let i=0; i<trackCountNeeded; i++) addTrack();

        // 恢复片段
        (data.blocks || []).forEach(b => {
          const f = formulas.find(x => x.code === b.code) || {name: b.name, code: b.code, compiled: compileFormula(b.code)};
          const track = tracks.find(t => t.id === b.trackId);
          if(track){
            const blockDiv = createBlock(f, b.trackId, b.start, b.duration);
            const block = blocks.find(x => x.div === blockDiv);
            if(block){
              block.volume = b.volume !== undefined ? b.volume : 1;
              block.rate = b.rate !== undefined ? b.rate : 1;
            }
            track.div.querySelector('.track-waves').appendChild(blockDiv);
          }
        });
      }

      document.getElementById('exportBtn').addEventListener('click', exportProject);
      document.getElementById('importBtn').addEventListener('click', () => {
        document.getElementById('importFile').click();
      });
      document.getElementById('importFile').addEventListener('change', e => {
        const file = e.target.files[0];
        if(!file) return;
        const reader = new FileReader();
        reader.onload = evt => {
          try{
            const data = JSON.parse(evt.target.result);
            importProject(data);
          }catch(err){
            alert('导入失败：文件格式错误');
          }
        };
        reader.readAsText(file);
        e.target.value = '';
      });

      // ===== 保存音频 =====
      function getProjectDuration(){
        if(blocks.length === 0) return 0;
        let maxEnd = 0;
        for(const b of blocks){
          const end = b.start + b.duration;
          if(end > maxEnd) maxEnd = end;
        }
        return maxEnd;
      }

      document.getElementById('saveAudioBtn').addEventListener('click', () => {
        const duration = getProjectDuration();
        const durationText = duration > 0 ? duration.toFixed(2) + ' 秒' : '无音频片段';
        document.getElementById('autoDuration').textContent = durationText;
        document.getElementById('saveAudioModal').classList.add('active');
      });
      document.getElementById('cancelSaveAudio').addEventListener('click', () => {
        document.getElementById('saveAudioModal').classList.remove('active');
      });
      document.getElementById('confirmSaveAudio').addEventListener('click', () => {
        const sampleRate = parseInt(document.getElementById('saveSampleRate').value);
        const duration = getProjectDuration();
        if(duration <= 0){
          alert('没有音频片段可导出');
          document.getElementById('saveAudioModal').classList.remove('active');
          return;
        }
        renderAndDownloadWav(sampleRate, duration);
        document.getElementById('saveAudioModal').classList.remove('active');
      });

      function renderAndDownloadWav(sampleRate, duration){
        const totalSamples = Math.floor(duration * sampleRate);
        const audioBuffer = new Float32Array(totalSamples);

        for(let i=0; i<totalSamples; i++){
          const t = i / sampleRate;
          let mix = 0;
          for(const b of blocks){
            if(t >= b.start && t < b.start + b.duration){
              const localTime = t - b.start;
              const sample = evalCompiled(b.compiled, localTime * (b.rate || 1));
              mix += sample * (b.volume || 1);
            }
          }
          audioBuffer[i] = Math.tanh(mix * 0.5) * 0.9;
        }

        downloadWav(audioBuffer, sampleRate);
      }

      function downloadWav(audioBuffer, sampleRate){
        const numChannels = 1;
        const numFrames = audioBuffer.length;
        const bytesPerSample = 2;
        const blockAlign = numChannels * bytesPerSample;
        const byteRate = sampleRate * blockAlign;
        const dataSize = numFrames * blockAlign;

        const buffer = new ArrayBuffer(44 + dataSize);
        const view = new DataView(buffer);

        function writeString(offset, string){
          for(let i=0; i<string.length; i++){
            view.setUint8(offset + i, string.charCodeAt(i));
          }
        }

        writeString(0, 'RIFF');
        view.setUint32(4, 36 + dataSize, true);
        writeString(8, 'WAVE');
        writeString(12, 'fmt ');
        view.setUint32(16, 16, true);
        view.setUint16(20, 1, true);
        view.setUint16(22, numChannels, true);
        view.setUint32(24, sampleRate, true);
        view.setUint32(28, byteRate, true);
        view.setUint16(32, blockAlign, true);
        view.setUint16(34, 16, true);
        writeString(36, 'data');
        view.setUint32(40, dataSize, true);

        let offset = 44;
        for(let i=0; i<numFrames; i++){
          const sample = Math.max(-1, Math.min(1, audioBuffer[i]));
          view.setInt16(offset, sample < 0 ? sample * 0x8000 : sample * 0x7FFF, true);
          offset += 2;
        }

        const blob = new Blob([buffer], {type: 'audio/wav'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = (document.getElementById('projectName').value || 'project') + '.wav';
        a.click();
        URL.revokeObjectURL(url);
      }

      defaultFormulas.forEach(f=>addFormula(f.name,f.code));
      renderRuler();
      addTrack(); addTrack(); addTrack();
    })();
  </script>
